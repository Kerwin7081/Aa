name: AI 行业日报

on:
  # 每天北京时间 09:00 自动运行（UTC 01:00）
  schedule:
    - cron: "0 1 * * *"
  # 支持手动触发
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅生成日报，不推送 (true/false)"
        required: false
        default: "false"

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 用于把日报文件 commit 回仓库

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and push digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # ── 推送渠道（按需配置，至少设置一个） ──
          WECOM_WEBHOOK_URL:    ${{ secrets.WECOM_WEBHOOK_URL }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET:      ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK_URL:   ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SMTP_HOST:      ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT:      ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USERNAME:       ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD:       ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:             ${{ secrets.EMAIL_TO }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python main.py $DRY_RUN_FLAG

      - name: Commit digest file to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          git diff --staged --quiet || git commit -m "chore: daily digest $(date +%Y-%m-%d)"
          git push
