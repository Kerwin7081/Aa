name: AI 行业日报

on:
  # 每天北京时间 09:00 自动运行（UTC 01:00）
  schedule:
    - cron: "0 1 * * *"
  # 支持手动触发，可选择是否只生成不推送
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅生成日报，不推送到任何渠道 (true/false)"
        required: false
        default: "false"

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许把日报文件 commit 回仓库

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 完整历史，确保 push 不会出现 non-fast-forward 问题

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest (and push if not dry-run)
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          # ── 推送渠道（至少配置一个 Secret，否则仅保存文件） ──────────────
          WECOM_WEBHOOK_URL:    ${{ secrets.WECOM_WEBHOOK_URL }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET:      ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK_URL:   ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SMTP_HOST:      ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT:      ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USERNAME:       ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD:       ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:             ${{ secrets.EMAIL_TO }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python main.py $DRY_RUN_FLAG

      - name: Commit digest file to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          # 只在有新文件时才 commit
          if ! git diff --staged --quiet; then
            git commit -m "chore: daily digest $(date +%Y-%m-%d)"
            git push
          else
            echo "No new digest file to commit."
          fi

      - name: Upload digest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: digests/
          retention-days: 30
